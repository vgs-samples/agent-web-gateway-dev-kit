[project]
name = "awg-sitecheck"
version = "0.1.0"
description = "Probe, verify and demo merchant checkouts through the VGS Agent Web Gateway"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.48",
  "pyyaml>=6",
  "cryptography>=42",
]

[project.scripts]
awg-sitecheck = "awg_sitecheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["awg_sitecheck"]
