<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            border: none;
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont,
            "Segoe UI", "Roboto", "Oxygen",
            "Ubuntu", "Cantarell", "Fira Sans",
            "Droid Sans", "Helvetica Neue", sans-serif;
            font-size: 1rem;
            font-weight: 400;
            overflow: hidden;
        }

        html,
        body,
        form,
        input,
        select {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%
        }

        input{
            display: none;
        }

        input::-ms-clear {
            display: none;
        }

        input::-webkit-input-placeholder {
            color: #b3b3b3;
        }

        input::-moz-placeholder {
            color: #b3b3b3;
        }
        input:-ms-input-placeholder {
            color: #b3b3b3;
        }
        input:-moz-placeholder {
            color: #b3b3b3;
        }

        .chckt-input-field--error {
            color: #ff7d00;
        }

        label {
            position: absolute;
            left: -9999px
        }

        :focus {
            outline: 0
        }

        #shiftTabField{
            display: block;
            height: 1px;
            width: 1px;
            position: absolute;
            top: -1px;
        }

        .aria-context{
            position: fixed;
            left: -5px;
            width: 5px;
            z-index: -1;
            opacity: 0;
            overflow: hidden;
        }

        .autocomplete-field{
            position: fixed;
            left: -5px;
            width: 5px;
            z-index: -1;
            opacity: 0;
            display: block;
        }

        @keyframes onautofillstart { from {} }
        @keyframes onautofillcancel { from {} }

        input:-webkit-autofill {
            /*box-shadow: 0 0 0 1000px #FFF inset;
            -webkit-text-fill-color: black;*/

            /*JS can listen to 'animationstart' event*/
            animation-duration: 5000s;
            animation-name: onautofillstart;
        }

        input:not(:-webkit-autofill) {
            animation-duration: 5000s;
            animation-name: onautofillcancel;
        }

        /* Workaround to remove autofill background and text color. */
        .input-field {
            background-clip: text !important;
        }

        .input-field:-webkit-autofill,
        .input-field:-webkit-autofill:active,
        .input-field:-webkit-autofill:hover,
        .input-field:-webkit-autofill:focus,
        .input-field:autofill {
            background-clip: text !important;
            transition: none !important;
        }

        
    </style>
</head>
<body>
<input id="shiftTabField" tabindex="-1" autocomplete="off" aria-hidden="true">
