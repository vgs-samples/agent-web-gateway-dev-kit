<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" role="img" aria-label="Only VGS ever turns an alias into card data" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="496" fill="#ffffff"/>
  <defs>
    <marker id="awg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c8c86"/>
    </marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1a1a18">Only VGS ever turns an alias into card data</text>
  <g fill="none" stroke="#8c8c86" stroke-width="1.25">
    <path d="M160 200H232" marker-end="url(#awg-arrow)"/>
    <path d="M576 124H512" marker-end="url(#awg-arrow)"/>
    <path d="M380 152V172" marker-end="url(#awg-arrow)"/>
    <path d="M380 228V248" marker-end="url(#awg-arrow)"/>
    <path d="M512 276H576" marker-end="url(#awg-arrow)"/>
    <path d="M380 304V352" marker-end="url(#awg-arrow)"/>
    <path d="M88 228V448H576" marker-end="url(#awg-arrow)"/>
  </g>
  <rect x="16" y="172" width="144" height="56" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
  <text x="88" y="196" text-anchor="middle" font-weight="600" fill="#1a1a18">Agent's browser</text>
  <text x="88" y="214" text-anchor="middle" font-size="11.5" fill="#5c5c58">holds aliases only</text>
  <rect x="232" y="56" width="296" height="268" rx="8" fill="#f1f1ee" stroke="#8c8c86" stroke-width="1.25"/>
  <text x="248" y="80" font-weight="600" fill="#1a1a18">VGS session proxy</text>
  <rect x="248" y="96" width="264" height="56" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
  <text x="380" y="118" text-anchor="middle" font-weight="600" fill="#1a1a18">Capture function</text>
  <text x="380" y="138" text-anchor="middle" font-size="11.5" fill="#5c5c58">route.response: stores key and genTime</text>
  <rect x="248" y="172" width="264" height="56" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
  <text x="380" y="194" text-anchor="middle" font-weight="600" fill="#1a1a18">Session values</text>
  <text x="380" y="214" text-anchor="middle" font-size="11.5" fill="#5c5c58">adyen_public_key, generationtime</text>
  <rect x="248" y="248" width="264" height="56" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"/>
  <text x="380" y="270" text-anchor="middle" font-weight="600" fill="#1a1a18">Re-encrypt function</text>
  <text x="380" y="290" text-anchor="middle" font-size="11.5" fill="#5c5c58">route.request: reveal, write JWEs</text>
  <rect x="248" y="352" width="264" height="56" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
  <text x="380" y="374" text-anchor="middle" font-weight="600" fill="#1a1a18">Vault</text>
  <text x="380" y="394" text-anchor="middle" font-size="11.5" fill="#5c5c58">aliases to card values</text>
  <rect x="576" y="96" width="160" height="56" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
  <text x="656" y="118" text-anchor="middle" font-weight="600" fill="#1a1a18">Adyen page</text>
  <text x="656" y="138" text-anchor="middle" font-size="11.5" fill="#5c5c58">secured-fields host</text>
  <rect x="576" y="248" width="160" height="56" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
  <text x="656" y="270" text-anchor="middle" font-weight="600" fill="#1a1a18">Merchant checkout</text>
  <text x="656" y="290" text-anchor="middle" font-size="11.5" fill="#5c5c58">e.g. www2.hm.com</text>
  <rect x="576" y="424" width="160" height="48" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
  <text x="656" y="452" text-anchor="middle" font-weight="600" fill="#1a1a18">Every other host</text>
  <text x="196" y="192" text-anchor="middle" font-size="11.5" fill="#5c5c58">via PAC</text>
  <text x="544" y="116" text-anchor="middle" font-size="11.5" fill="#5c5c58">page</text>
  <text x="544" y="268" text-anchor="middle" font-size="11.5" fill="#5c5c58">JWE</text>
  <text x="388" y="340" font-size="11.5" fill="#5c5c58">reveal</text>
  <text x="340" y="440" text-anchor="middle" font-size="11.5" fill="#5c5c58">DIRECT, per the PAC</text>
</svg>
