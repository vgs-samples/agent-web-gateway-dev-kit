        Error codes: `adapter_immutable`, `invalid_adapter`, `function_not_in_adapter`, `invalid_inputs`, `concurrent_change`,
        `destination_overlap`.


        Requires `agent-gateway:write`.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AdapterDestinationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterDestinationRequest'
    delete:
      operationId: deleteAdapterDestination
      summary: Delete an adapter destination
      tags:
      - Adapter destinations
      responses:
        '204':
          description: Deleted (route entries, then row)
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      x-vgs-required-scope: agent-gateway:write
      description: Requires `agent-gateway:write`.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token of a VGS service account with the operation's scope
  parameters:
    VgsTenant:
      name: VGS-Tenant
      in: header
      required: true
      description: Vault id
      schema:
        type: string
  schemas:
    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: integer
              code:
                type: string
                description: Present on 400, 409 and 503 errors
              title:
                type: string
              detail:
                type: string
              href:
                type: string
                description: The request URL
    PageMeta:
      type: object
      properties:
        total_pages:
          type: integer
        total_elements:
          type: integer
    PageLinks:
      type: object
      additionalProperties:
        type: string
    Alias:
      type: object
      properties:
        alias:
          type: string
          description: Vault alias (for card parts) or loose alias
        format:
          type: string
          enum:
          - card_number
          - card_cvc
          - text
          description: Loose aliases only; card parts are forced
        bin:
          type: string
          description: Required for card_number unless the alias is a 13-19 digit number; defaults to its first 6 digits
        length:
          type: integer
          description: 'Card number default: alias length if numeric, else 16; CVC default 3'
        storage:
          type: string
          enum:
          - PERSISTENT
          - VOLATILE
          default: PERSISTENT
        label:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
          description: Text aliases only
        value:
          type: string
          description: The session alias handed to the agent; create response only
          readOnly: true
    Card:
      type: object
      required:
      - number
      properties:
        label:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
          description: Required when the session has more than one card
        number:
          $ref: '#/components/schemas/Alias'
        cvc:
          $ref: '#/components/schemas/Alias'
        expiry:
          $ref: '#/components/schemas/Alias'
        holder:
          $ref: '#/components/schemas/Alias'
    Token:
      type: object
      properties:
        alias:
          type: string
        format:
          type: string
        value:
          type: string
    Proxy:
      type: object
      properties:
        url:
          type: string
          description: '`<scheme>://<session id>:<secret>@<host>:<port>`; the secret appears only here'
        ca_bundle:
          type: string
          description: PEM of the forward proxy CA(s)
        pac_url:
          type: string
          description: Pre-signed PAC link, valid until the session expires
    EgressProxySettings:
      type: object
      required:
      - type
      - scheme
      - hostname
      - port
      properties:
        type:
          type: string
          enum:
          - custom
        scheme:
          type: string
          enum:
          - http
          - https
        hostname:
          type: string
          description: Public host name; not a never-host
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
          maxLength: 256
        password:
          type: string
          maxLength: 256
          writeOnly: true
        has_password:
          type: boolean
          readOnly: true
    StepUp:
      type: object
      properties:
        webhook_url:
          type: string
        hold_seconds:
          type: integer
        webhook_secret:
          type: string
          description: Create response only
          readOnly: true
    RevealSessionAttributes:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/Alias'
          description: '`cards` or `aliases` is required; at most 20 parts in total'
        allowed_hosts:
          type: array
          maxItems: 20
          items:
            type: string
            description: 'Exact host name: no wildcard, port or IP'
        allowed_client_cidrs:
          type: array
          maxItems: 10
          items:
            type: string
            description: IPv4/IPv6 address or CIDR
        egress_proxy_settings:
          $ref: '#/components/schemas/EgressProxySettings'
        context:
          type: object
          maxProperties: 32
          propertyNames:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            type: string
            maxLength: 512
          description: At most 4096 characters in total (1024 for stateless sessions)
        adapter:
          type: string
          description: 'AD id or adapter name; stored as the id. Absent: every enabled binding matches'
        state:
          type: string
          enum:
          - active
          - revoked
          - expired
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        unlisted_host_mode:
          type: string
          enum:
          - strict
          - guarded
          - step_up
          description: From tenant preferences
          readOnly: true
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/Token'
          readOnly: true
        session_aliases:
          type: array
          items:
            $ref: '#/components/schemas/Token'
          readOnly: true
        proxy:
          $ref: '#/components/schemas/Proxy'
          readOnly: true
        step_up:
          $ref: '#/components/schemas/StepUp'
          readOnly: true
        pending_approvals:
          type: integer
          readOnly: true
        reveal_count:
          type: integer
          readOnly: true
        refusal_count:
          type: integer
          readOnly: true
        values:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: 'With `include=values`: values functions stored, keyed by adapter id then key'
          readOnly: true
    ProxyCaAttributes:
      type: object
      properties:
        host:
          type: string
        scheme:
          type: string
        port:
          type: integer
        ca_bundle:
          type: string
    ApprovalAttributes:
      type: object
      properties:
        reveal_session_id:
          type: string
          readOnly: true
        host:
          type: string
          readOnly: true
        method:
          type: string
          readOnly: true
        path:
          type: string
          readOnly: true
        state:
          type: string
          enum:
          - pending
          - approved
          - denied
          - expired
          description: 'PATCH: `approved` or `denied`'
        scope:
          type: string
          enum:
          - request
          - session
          default: request
        requested_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
    DestinationAttributes:
      type: object
      properties:
        host_pattern:
          type: string
          description: Exact host or `*.` pattern; immutable after create
        action:
          type: string
          enum:
          - trust
          - guarded
          - block
        origin:
          type: string
          enum:
          - manual
          - auto
          readOnly: true
        route_id:
          type: string
          readOnly: true
        created_by:
          type: string
          readOnly: true
        promoted_by:
          type: string
          readOnly: true
        promoted_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    RegistryEntryAttributes:
      type: object
      properties:
        host_pattern:
          type: string
        action:
          type: string
          enum:
          - trust
          - guarded
    InvocationAttributes:
      type: object
      properties:
        input:
          type: string
          description: '`invoke` functions only'
          writeOnly: true
        request:
          type: object
          properties:
            method:
              type: string
            url:
              type: string
              format: uri
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              type: string
              description: <= 1 MiB
          writeOnly: true
        response:
          type: object
          properties:
            status:
              type: integer
              minimum: 100
              maximum: 599
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              type: string
              description: <= 1 MiB
          writeOnly: true
        destination:
          type: string
          description: AX id whose bindings supply the inputs; not with `inputs`
          writeOnly: true
        inputs:
          type: object
          additionalProperties:
            type: string
            maxLength: 4096
          writeOnly: true
        session:
          type: object
          properties:
            values:
              type: object
              additionalProperties:
                type: string
            context:
              type: object
              additionalProperties:
                type: string
          writeOnly: true
        function:
          type: string
          readOnly: true
        source:
          type: string
          enum:
          - api
          - test
          readOnly: true
        dry_run:
          type: boolean
          readOnly: true
        status:
          type: string
          enum:
          - succeeded
          - failed
          readOnly: true
        error:
          type: string
          readOnly: true
        duration_ms:
          type: integer
          readOnly: true
        result:
          type: object
          description: Create response only
          properties:
            output:
              type: string
            request:
              type: object
              additionalProperties: true
            response:
              type: object
              additionalProperties: true
            session:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties:
                    type: string
          readOnly: true
        created_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    InputSource:
      type: object
      required:
      - from
      properties:
        from:
          type: string
          enum:
          - constant
          - request.body
          - response.body
          - request.header
          - response.header
          - request.query
          - session.value
        value:
          type: string
          description: '`constant`: <= 4096 characters, no `${`'
        path:
          type: string
          description: '`*.body`: JSONPath (`$`, `.key`, `[''key'']`, `[index]`)'
        name:
          type: string
          description: '`*.header` / `request.query`'
        key:
          type: string
          description: '`session.value` (behind a feature flag)'
    AdapterDestinationAttributes:
      type: object
      properties:
        adapter:
          type: string
          description: AD id or name on input; AD id on output; immutable
        adapter_version:
          type: integer
        enabled:
          type: boolean
          default: true
        when:
          type: object
          required:
          - host
          properties:
            host:
              type: string
              description: One of the vault's agent destinations, not blocked
            method:
              type: string
              enum:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - HEAD
              - OPTIONS
            path:
              type: string
              maxLength: 1024
              description: Starts with `/`; `*` matches any characters
        functions:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: string
              inputs:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/InputSource'
              extension_point:
                type: string
                enum:
                - route.request
                - route.response
                readOnly: true
        revision:
          type: integer
          readOnly: true
        created_by:
          type: string
          readOnly: true
        updated_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    FunctionInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        required:
          type: boolean
          default: false
    FunctionAttributes:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        language:
          type: string
          enum:
          - larky
          default: larky
        source:
          type: string
          description: Larky source, <= 262144 UTF-8 bytes, no `${`, must parse; `vault` only via `load("@vgs//vault", "vault")`
        extension_point:
          type: string
          enum:
          - route.request
          - route.response
          - invoke
        inputs:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/FunctionInput'
        previous_version:
          type: string
          description: FN id of an earlier version owned by the same owner
        sha256:
          type: string
          description: Hex SHA-256 of `source`
          readOnly: true
        owner:
          type: string
          enum:
          - tenant
          - vgs
          readOnly: true
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          readOnly: true
        created_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    AdapterAttributes:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        functions:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            description: FN id
          description: 'On create and new version: the version''s functions. In responses: the functions of the version shown'
        publish_at:
          type: string
          description: 'PATCH only: `now`, or an ISO-8601 date-time with offset'
          writeOnly: true
        version:
          type: integer
          readOnly: true
        latest_version:
          type: integer
          readOnly: true
        published_version:
          type: integer
          readOnly: true
        scheduled_version:
          type: integer
          readOnly: true
        scheduled_at:
          type: string
          format: date-time
          readOnly: true
        owner:
          type: string
          enum:
          - tenant
          - vgs
          readOnly: true
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          readOnly: true
        created_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    RevealSessionResource:
      type: object
      required:
      - type
      - attributes
      properties:
        type:
          type: string
          enum:
          - reveal-sessions
        id:
          type: string
          example: RSxxxxxxxxxxxxxxxxxxxxxx
        attributes:
          $ref: '#/components/schemas/RevealSessionAttributes'
    RevealSessionDocument:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/RevealSessionResource'
    RevealSessionListDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RevealSessionResource'
        meta:
          $ref: '#/components/schemas/PageMeta'
        links:
          $ref: '#/components/schemas/PageLinks'
    RevealSessionRequest:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - attributes
          properties:
            type:
              type: string
              enum:
              - reveal-sessions
            id:
              type: string
            attributes:
              $ref: '#/components/schemas/RevealSessionAttributes'
    ProxyCaResource:
      type: object
      required:
      - type
      - attributes
      properties:
        type:
          type: string
          enum:
          - reveal-session-proxy-ca
        id:
          type: string
          example: proxy-ca
        attributes:
          $ref: '#/components/schemas/ProxyCaAttributes'
    ProxyCaDocument:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/ProxyCaResource'
    ProxyCaListDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProxyCaResource'
        meta:
          $ref: '#/components/schemas/PageMeta'
        links:
          $ref: '#/components/schemas/PageLinks'
    ProxyCaRequest:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - attributes
          properties:
            type:
              type: string
              enum:
              - reveal-session-proxy-ca
            id:
              type: string
            attributes:
              $ref: '#/components/schemas/ProxyCaAttributes'
    ApprovalResource:
      type: object
      required:
      - type
      - attributes
      properties:
        type:
          type: string
          enum:
