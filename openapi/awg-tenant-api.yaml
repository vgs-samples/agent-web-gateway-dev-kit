openapi: 3.1.0
info:
  title: VGS Agent Web Gateway API
  version: '2026-11-12'
  description: Reveal sessions, agent destinations, functions, adapters and adapter destinations. JSON:API. Scopes are listed per operation (`x-vgs-required-scope`); write scopes do not
    include read.
servers:
- url: https://sandbox.vgsapi.com
  description: Sandbox
- url: https://vgsapi.com
  description: Live
security:
- bearerAuth: []
tags:
- name: Reveal sessions
- name: Step-up approvals
- name: Destinations
- name: Functions
- name: Adapters
- name: Adapter destinations
paths:
  /reveal-sessions:
    post:
      operationId: createRevealSession
      summary: Create a reveal session
      tags:
      - Reveal sessions
      responses:
        '201':
          description: Created; the only response carrying `proxy` and alias values
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RevealSessionDocument'
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
      x-vgs-required-scope: reveal-sessions:write
      description: 'Lifetime and unlisted-host mode come from tenant preferences and cannot be set per session.


        Error codes: `missing_attributes`, `missing_aliases`, `too_many_aliases`, `invalid_alias`, `unknown_format`, `missing_bin`,
        `invalid_storage`, `invalid_label`, `invalid_card`, `invalid_card_label`, `missing_card_number`, `invalid_host`, `never_host`,
        `too_many_hosts`, `invalid_client_cidr`, `too_many_client_cidrs`, `invalid_context`, `invalid_adapter`, `adapter_unavailable`,
        `invalid_egress_proxy_settings`, `invalid_egress_proxy_hostname`, `invalid_egress_proxy_port`, `invalid_egress_proxy_credentials`,
        `ttl_not_configurable`, `unlisted_host_mode_not_configurable`, `step_up_not_configurable`, `session_too_large`, `invalid_ttl`,
        `stateless_unavailable`, `reveal_session_proxy_host_unusable`.


        Requires `reveal-sessions:write`.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RevealSessionRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/RevealSessionRequest'
    get:
      operationId: listRevealSessions
      summary: List reveal sessions
      tags:
      - Reveal sessions
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RevealSessionListDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
      x-vgs-required-scope: reveal-sessions:read
      description: 'Newest expiry first; items carry no `values`.


        Error codes: `invalid_state`, `invalid_paging`.


        Requires `reveal-sessions:read`.'
      parameters:
      - name: state
        in: query
        required: false
        description: '`active` (default) or `revoked`'
        schema:
          type: string
          enum:
          - active
          - revoked
      - name: offset
        in: query
        required: false
        description: Page offset, >= 0 (default 0)
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        description: Page size, 1..100 (default 30)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
  /reveal-sessions/{id}:
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
    - name: id
      in: path
      required: true
      description: Reveal session id
      schema:
        type: string
        example: RSxxxxxxxxxxxxxxxxxxxxxx
    get:
      operationId: getRevealSession
      summary: Read a reveal session
      tags:
      - Reveal sessions
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RevealSessionDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      x-vgs-required-scope: reveal-sessions:read
      description: 'Never returns secrets. 404 also for stateless sessions.


        Error codes: `invalid_include`.


        Requires `reveal-sessions:read`.'
      parameters:
      - name: include
        in: query
        required: false
        description: Only `values` is supported
        schema:
          type: string
          enum:
          - values
    delete:
      operationId: revokeRevealSession
      summary: Revoke a reveal session
      tags:
      - Reveal sessions
      responses:
        '204':
          description: Revoked (idempotent)
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      x-vgs-required-scope: reveal-sessions:write
      description: 'Error codes: `revocation_list_disabled`.


        Requires `reveal-sessions:write`.'
  /reveal-sessions/{id}/credentials:
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
    - name: id
      in: path
      required: true
      description: Reveal session id
      schema:
        type: string
        example: RSxxxxxxxxxxxxxxxxxxxxxx
    post:
      operationId: reissueRevealSessionCredentials
      summary: Reissue the session's proxy password
      tags:
      - Reveal sessions
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RevealSessionDocument'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '500':
          $ref: '#/components/responses/E500'
      x-vgs-required-scope: reveal-sessions:write
      description: 'Off unless the platform enables credential reissue (`404 credential_reissue_disabled`). Redis sessions
        only.


        Error codes: `credential_reissue_disabled`, `session_not_active`, `reveal_session_proxy_host_unusable`.


        Requires `reveal-sessions:write`.'
  /reveal-sessions/proxy-ca:
    get:
      operationId: getRevealSessionProxyCa
      summary: The forward proxy CA bundle
      tags:
      - Reveal sessions
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ProxyCaDocument'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      x-vgs-required-scope: reveal-sessions:read
      description: Requires `reveal-sessions:read`.
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
  /reveal-sessions/{id}.pac:
    parameters:
    - name: id
      in: path
      required: true
      description: Reveal session id
      schema:
        type: string
        example: RSxxxxxxxxxxxxxxxxxxxxxx
    get:
      operationId: getRevealSessionPac
      summary: The session's PAC file (pre-signed link)
      tags:
      - Reveal sessions
      responses:
        '200':
          description: PAC script
          content:
            application/x-ns-proxy-autoconfig:
              schema:
                type: string
        '404':
          description: 'Any failure (empty body): expired link, bad signature, inactive session, PAC disabled'
      description: 'No token or tenant header: the signed query is the credential. Use `proxy.pac_url` as returned.'
      parameters:
      - name: tenant
        in: query
        required: true
        description: Vault id
        schema:
          type: string
          maxLength: 128
      - name: expires
        in: query
        required: true
        description: Epoch seconds, in the future
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,11}$
      - name: signature
        in: query
        required: true
        description: base64url HMAC-SHA256, 43 characters
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      security: []
  /reveal-session-approvals:
    get:
      operationId: listApprovals
      summary: List a session's step-up approvals
      tags:
      - Step-up approvals
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ApprovalListDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      x-vgs-required-scope: reveal-sessions:read
      description: 'Error codes: `missing_filter`, `invalid_paging`.


        Requires `reveal-sessions:read`.'
      parameters:
      - name: filter[reveal_session]
        in: query
        required: true
        description: Reveal session id
        schema:
          type: string
      - name: offset
        in: query
        required: false
        description: Page offset, >= 0 (default 0)
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        description: Page size, 1..100 (default 30)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
  /reveal-session-approvals/{id}:
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
    - name: id
      in: path
      required: true
      description: Approval id
      schema:
        type: string
        example: APxxxxxxxxxxxxxxxxxxxxxx
    get:
      operationId: getApproval
      summary: Read an approval
      tags:
      - Step-up approvals
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ApprovalDocument'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      x-vgs-required-scope: reveal-sessions:read
      description: Requires `reveal-sessions:read`.
    patch:
      operationId: decideApproval
      summary: Approve or deny a held request
      tags:
      - Step-up approvals
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ApprovalDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      x-vgs-required-scope: reveal-sessions:write
      description: '`data.type` must be `reveal-session-approvals` and `data.id` the path id. `scope: session` with `approved`
        approves the host for the rest of the session.


        Error codes: `missing_attributes`, `invalid_type`, `id_mismatch`, `invalid_state`, `invalid_scope`, `approval_closed`.


        Requires `reveal-sessions:write`.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
  /agent-gateway-destinations:
    get:
      operationId: listDestinations
      summary: List agent destinations
      tags:
      - Destinations
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DestinationListDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
      x-vgs-required-scope: agent-gateway:read
      description: Requires `agent-gateway:read`.
    post:
      operationId: createDestination
      summary: Create an agent destination
      tags:
      - Destinations
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DestinationDocument'
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
      x-vgs-required-scope: agent-gateway:write
      description: 'Creates a forward-proxy route; at most 1000 per vault. A `trust` records the caller as approver.


        Error codes: `missing_attributes`, `invalid_host_pattern`, `invalid_action`, `never_host`, `origin_not_writable`,
        `too_many_destinations`, `destination_exists`.


        Requires `agent-gateway:write`.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/DestinationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationRequest'
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
  /agent-gateway-destinations/{id}:
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
    - name: id
      in: path
      required: true
      description: Agent destination id
      schema:
        type: string
        example: AGDxxxxxxxxxxxxxxxxxxxxxx
    get:
      operationId: getDestination
      summary: Read an agent destination
      tags:
      - Destinations
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DestinationDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      x-vgs-required-scope: agent-gateway:read
      description: Requires `agent-gateway:read`.
    patch:
      operationId: updateDestination
      summary: Change a destination's action
      tags:
      - Destinations
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DestinationDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      x-vgs-required-scope: agent-gateway:write
      description: 'Error codes: `missing_attributes`, `invalid_action`, `host_pattern_immutable`, `origin_not_writable`,
        `never_host`, `route_tag_limit`.


        Requires `agent-gateway:write`.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/DestinationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationRequest'
    delete:
      operationId: deleteDestination
      summary: Delete an agent destination
      tags:
      - Destinations
      responses:
        '204':
          description: Deleted (route, then row)
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      x-vgs-required-scope: agent-gateway:write
      description: 'Hard delete. No in-use check against adapter destinations.


        Requires `agent-gateway:write`.'
  /agent-gateway-registry:
    get:
      operationId: listRegistry
      summary: VGS trusted destinations as this vault sees them
      tags:
      - Destinations
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RegistryEntryListDocument'
        '403':
          $ref: '#/components/responses/E403'
      x-vgs-required-scope: agent-gateway:read
      description: Requires `agent-gateway:read`.
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
  /functions:
    get:
      operationId: listFunctions
      summary: List own and VGS functions
      tags:
      - Functions
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FunctionListDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
      x-vgs-required-scope: agent-gateway:read
      description: 'Newest first, at most 200.


        Requires `agent-gateway:read`.'
      parameters:
      - name: filter[name]
        in: query
        required: false
        description: Exact name
        schema:
          type: string
    post:
      operationId: createFunction
      summary: Create a function
      tags:
      - Functions
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FunctionDocument'
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
      x-vgs-required-scope: agent-gateway:write
      description: 'Functions are immutable: a new version is a new function linked by `previous_version`.


        Error codes: `missing_attributes`, `invalid_name`, `invalid_language`, `invalid_extension_point`, `invalid_source`,
        `source_too_large`, `invalid_inputs`, `invalid_previous_version`.


        Requires `agent-gateway:write`.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/FunctionRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionRequest'
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
  /functions/{id}:
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
    - name: id
      in: path
      required: true
      description: Function id
      schema:
        type: string
        example: FNxxxxxxxxxxxxxxxxxxxxxx
    get:
      operationId: getFunction
      summary: Read a function
      tags:
      - Functions
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FunctionDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      x-vgs-required-scope: agent-gateway:read
      description: Requires `agent-gateway:read`.
    delete:
      operationId: deleteFunction
      summary: Soft-delete an own function
      tags:
      - Functions
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      x-vgs-required-scope: agent-gateway:write
      description: '404 for VGS functions.


        Error codes: `function_in_use`.


        Requires `agent-gateway:write`.'
  /functions/{id}/invocations:
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
    - name: id
      in: path
      required: true
      description: Function id
      schema:
        type: string
        example: FNxxxxxxxxxxxxxxxxxxxxxx
    post:
      operationId: invokeFunction
      summary: Dry-run a route function, or run an invoke function
      tags:
      - Functions
      responses:
        '201':
          description: 'Recorded, even when the run failed (`status: failed`)'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InvocationDocument'
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
      x-vgs-required-scope: agent-gateway:write
      description: '`route.request`: `request` (method, absolute URL). `route.response`: `response` only. `invoke`: `input`
        only. 10 s deadline, bodies <= 1 MiB. `session.card` and aliases always fail in a dry run.


        Error codes: `missing_attributes`, `invalid_invocation`, `invalid_inputs`, `invalid_function`, `invocations_unavailable`.


        Requires `agent-gateway:write`.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/InvocationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationRequest'
  /function-invocations:
    get:
      operationId: listInvocations
      summary: List function invocations
      tags:
      - Functions
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InvocationListDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
      x-vgs-required-scope: agent-gateway:read
      description: 'Newest first, at most 100; never `result`.


        Error codes: `invalid_filter`.


        Requires `agent-gateway:read`.'
      parameters:
      - name: filter[function]
        in: query
        required: false
        description: FN id
        schema:
          type: string
      - name: filter[source]
        in: query
        required: false
        description: '`api` or `test`'
        schema:
          type: string
          enum:
          - api
          - test
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
  /function-invocations/{id}:
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
    - name: id
      in: path
      required: true
      description: Invocation id
      schema:
        type: string
        example: FIxxxxxxxxxxxxxxxxxxxxxx
    get:
      operationId: getInvocation
      summary: Read a function invocation
      tags:
      - Functions
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InvocationDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      x-vgs-required-scope: agent-gateway:read
      description: Requires `agent-gateway:read`.
  /agent-gateway-adapters:
    get:
      operationId: listAdapters
      summary: List own and published VGS adapters
      tags:
      - Adapters
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdapterListDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
      x-vgs-required-scope: agent-gateway:read
      description: Requires `agent-gateway:read`.
    post:
      operationId: createAdapter
      summary: Create an adapter (version 1)
      tags:
      - Adapters
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdapterDocument'
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
      x-vgs-required-scope: agent-gateway:write
      description: 'Error codes: `missing_attributes`, `invalid_name`, `invalid_functions`, `adapter_exists`.


        Requires `agent-gateway:write`.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AdapterRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterRequest'
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
  /agent-gateway-adapters/{id}:
    parameters:
    - $ref: '#/components/parameters/VgsTenant'
    - name: id
      in: path
      required: true
      description: Adapter id
      schema:
        type: string
        example: ADxxxxxxxxxxxxxxxxxxxxxx
    get:
      operationId: getAdapter
      summary: Read an adapter
      tags:
      - Adapters
      responses:
