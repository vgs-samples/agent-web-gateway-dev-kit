      tags:
      - Adapter destinations
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdapterDestinationDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      x-vgs-required-scope: agent-gateway:read
      description: Requires `agent-gateway:read`.
    patch:
      operationId: updateAdapterDestination
      summary: Change version, enabled, when or functions
      tags:
      - Adapter destinations
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdapterDestinationDocument'
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      x-vgs-required-scope: agent-gateway:write
