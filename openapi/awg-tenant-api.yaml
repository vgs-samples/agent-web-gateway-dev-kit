        description: AD id or name
        schema:
          type: string
    post:
      operationId: createAdapterDestination
      summary: Bind an adapter version's functions to traffic
      tags:
      - Adapter destinations
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdapterDestinationDocument'
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
      x-vgs-required-scope: agent-gateway:write
      description: 'At most 100 per vault. Without `adapter`, exactly one function and no version: an `fn-<FN id>` adapter
        is created or reused.


