name: Build control panel

on:
  push:
    paths:
      - 'tools/vgs-proxy-controls/**'
      - '.github/workflows/control-panel-package.yml'
  pull_request:
    paths:
      - 'tools/vgs-proxy-controls/**'
      - '.github/workflows/control-panel-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Test and package extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/vgs-proxy-controls
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify source checksums
        run: sha256sum --check SHA256SUMS
      - name: Test local helper with synthetic fixtures
        run: python -m unittest discover -p 'test_*.py'
      - name: Test extension worker
        run: node --test test_session_proxy_extension.mjs
      - name: Build allowlisted source package
        run: python build-package.py
      - name: Verify archive and write download checksum
        run: |
          cd dist
          for package in *.zip; do
            unzip -t "$package"
            sha256sum "$package" > "$package.sha256"
          done
      - name: Upload downloadable kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-web-gateway-control-panel
          path: |
            tools/vgs-proxy-controls/dist/*.zip
            tools/vgs-proxy-controls/dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
