name: Test dev-kit bootstrap

on:
  push:
    paths: ['awg', 'tools/bootstrap/**', 'tests/**', '.github/workflows/bootstrap.yml']
  pull_request:
    paths: ['awg', 'tools/bootstrap/**', 'tests/**', '.github/workflows/bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      # One platform's failure must not cancel the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: bash -n awg
      - run: python -m unittest discover -s tests -v
